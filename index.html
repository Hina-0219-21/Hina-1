<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电机学题库 — 在线刷题</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2a2a3a;
    --text: #e0dcd0;
    --text2: #8a8680;
    --accent: #d4a853;
    --accent2: #c4953a;
    --correct: #4caf7d;
    --wrong: #e05555;
    --correct-bg: #1a3a2a;
    --wrong-bg: #3a1a1a;
    --grain: rgba(255,255,255,.015);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  
  html { font-size: 16px; }
  body {
    font-family: 'Noto Sans SC', 'Noto Serif SC', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(212,168,83,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 100%, rgba(212,168,83,0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Noise overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 2rem 0 1rem;
  }
  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
  }
  .header .subtitle {
    font-size: 0.9rem;
    color: var(--text2);
    font-weight: 300;
  }

  /* Progress Bar */
  .progress-wrap {
    margin-bottom: 1.5rem;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 0.4rem;
  }
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(212,168,83,0.03), transparent 70%);
    pointer-events: none;
  }

  .question-type-badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 0.2rem 0.7rem;
    border-radius: 99px;
    margin-bottom: 1rem;
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .badge-mc {
    background: rgba(212,168,83,0.15);
    color: var(--accent);
    border: 1px solid rgba(212,168,83,0.3);
  }
  .badge-fb {
    background: rgba(140,160,210,0.15);
    color: #8ca0d2;
    border: 1px solid rgba(140,160,210,0.3);
  }

  .question-number {
    font-size: 0.85rem;
    color: var(--text2);
    margin-bottom: 0.8rem;
  }

  .question-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.15rem;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 1.8rem;
  }

  /* Options */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    padding: 0.9rem 1.1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    text-align: left;
    transition: all 0.2s ease;
    position: relative;
  }
  .option-btn:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(212,168,83,0.08);
    transform: translateX(3px);
  }
  .option-btn .option-letter {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.85rem;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }
  .option-btn.locked {
    cursor: default;
    pointer-events: none;
  }
  .option-btn.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option-btn.correct .option-letter {
    background: var(--correct);
    color: #fff;
    border-color: var(--correct);
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option-btn.wrong .option-letter {
    background: var(--wrong);
    color: #fff;
    border-color: var(--wrong);
  }
  .option-btn.reveal-answer {
    border-color: var(--correct);
    background: rgba(76,175,125,0.08);
  }
  .option-btn.reveal-answer .option-letter {
    background: var(--correct);
    color: #fff;
    border-color: var(--correct);
  }

  /* Fill-in-blank input */
  .fb-input-group {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .fb-input-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .fb-input-row label {
    font-size: 0.85rem;
    color: var(--text2);
    white-space: nowrap;
    min-width: 3rem;
  }
  .fb-input {
    flex: 1;
    padding: 0.7rem 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    outline: none;
  }
  .fb-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,168,83,0.1);
  }
  .fb-input.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .fb-input.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 0.8rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 0.75rem 1.8rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.02em;
  }
  .btn:hover {
    border-color: var(--accent);
    background: rgba(212,168,83,0.08);
  }
  .btn-primary {
    background: var(--accent);
    color: #1a1a14;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover {
    background: var(--accent2);
    border-color: var(--accent2);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Feedback */
  .feedback {
    text-align: center;
    padding: 0.8rem;
    margin-top: 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: var(--correct-bg);
    color: var(--correct);
    border: 1px solid rgba(76,175,125,0.3);
  }
  .feedback.wrong-fb {
    background: var(--wrong-bg);
    color: var(--wrong);
    border: 1px solid rgba(224,85,85,0.3);
  }

  /* Start Screen */
  .start-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
  }
  .start-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 2.4rem;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .start-subtitle {
    color: var(--text2);
    font-size: 1rem;
  }
  .mode-selector {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    padding: 0.7rem 1.5rem;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .mode-btn:hover {
    border-color: var(--accent);
  }
  .mode-btn.active {
    background: var(--accent);
    color: #1a1a14;
    border-color: var(--accent);
    font-weight: 600;
  }
  .stats-row {
    display: flex;
    gap: 2rem;
    color: var(--text2);
    font-size: 0.85rem;
  }
  .stats-row span {
    color: var(--accent);
    font-weight: 600;
  }

  /* Results Screen */
  .results-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }
  .score-circle {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .score-circle::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(212,168,83,0.2);
  }
  .score-number {
    font-size: 3rem;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Noto Serif SC', serif;
  }
  .score-label {
    font-size: 0.8rem;
    color: var(--text2);
  }
  .results-stats {
    display: flex;
    gap: 2rem;
    font-size: 0.9rem;
    color: var(--text2);
  }
  .results-stats div {
    text-align: center;
  }
  .results-stats .val {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
  }

  /* Review Section */
  .review-section {
    margin-top: 1rem;
    width: 100%;
  }
  .review-section h3 {
    font-family: 'Noto Serif SC', serif;
    color: var(--accent);
    margin-bottom: 1rem;
    font-size: 1.1rem;
  }
  .review-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    margin-bottom: 0.8rem;
  }
  .review-card .r-q {
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
  }
  .review-card .r-a {
    font-size: 0.85rem;
    color: var(--correct);
  }
  .review-card .r-ua {
    font-size: 0.85rem;
    color: var(--wrong);
    text-decoration: line-through;
    margin-right: 0.5rem;
  }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in-up {
    animation: fadeInUp 0.5s ease forwards;
  }

  @media (max-width: 600px) {
    .card { padding: 1.3rem; }
    .question-text { font-size: 1rem; }
    .start-title { font-size: 1.7rem; }
  }
</style>
</head>

// ========== APP STATE ==========
const App = {
  mode: 'all',        // 'all' | 'mc' | 'fb'
  order: 'random',    // 'random' | 'seq'
  screen: 'start',    // 'start' | 'quiz' | 'results'
  questions: [],
  currentIndex: 0,
  answers: [],        // { questionId, userAnswer, correct, type }
  locked: false,
};

// ========== Build Question List ==========
function buildQuestionList() {
  const list = [];
  if (App.mode === 'all' || App.mode === 'mc') {
    QUESTION_DATA.multipleChoice.forEach(q => list.push({ ...q, type: 'mc' }));
  }
  if (App.mode === 'all' || App.mode === 'fb') {
    QUESTION_DATA.fillBlank.forEach(q => list.push({ ...q, type: 'fb' }));
  }
  if (App.order === 'random') {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
  return list;
}

// ========== RENDER ==========
function render() {
  const app = document.getElementById('app');
  if (App.screen === 'start') renderStart(app);
  else if (App.screen === 'quiz') renderQuiz(app);
  else if (App.screen === 'results') renderResults(app);
}

function renderStart(app) {
  const mcCount = QUESTION_DATA.multipleChoice.length;
  const fbCount = QUESTION_DATA.fillBlank.length;
  const totalCount = mcCount + fbCount;
  
  let countText = '';
  if (App.mode === 'all') countText = `共 ${totalCount} 题（选择题 ${mcCount} + 填空题 ${fbCount}）`;
  else if (App.mode === 'mc') countText = `共 ${mcCount} 道选择题`;
  else countText = `共 ${fbCount} 道填空题`;

  app.innerHTML = `
    <div class="start-screen fade-in-up">
      <div>
        <div class="start-title">电 机 学</div>
        <div class="start-subtitle">在线刷题 · 题库练习</div>
      </div>
      <div class="stats-row">
        <span>📝 ${totalCount}</span> 道题目
      </div>
      <div>
        <div style="color:var(--text2);font-size:0.8rem;margin-bottom:0.5rem;text-align:center;">题目类型</div>
        <div class="mode-selector">
          <button class="mode-btn ${App.mode==='all'?'active':''}" onclick="setMode('all')">全部题目</button>
          <button class="mode-btn ${App.mode==='mc'?'active':''}" onclick="setMode('mc')">仅选择题</button>
          <button class="mode-btn ${App.mode==='fb'?'active':''}" onclick="setMode('fb')">仅填空题</button>
        </div>
      </div>
      <div>
        <div style="color:var(--text2);font-size:0.8rem;margin-bottom:0.5rem;text-align:center;">答题顺序</div>
        <div class="mode-selector">
          <button class="mode-btn ${App.order==='random'?'active':''}" onclick="setOrder('random')">随机出题</button>
          <button class="mode-btn ${App.order==='seq'?'active':''}" onclick="setOrder('seq')">顺序出题</button>
        </div>
      </div>
      <div style="color:var(--text2);font-size:0.85rem;">${countText}</div>
      <button class="btn btn-primary" style="font-size:1.05rem;padding:0.85rem 3rem;" onclick="startQuiz()">
        开始刷题
      </button>
    </div>
  `;
}

function renderQuiz(app) {
  if (App.questions.length === 0) { App.screen = 'start'; render(); return; }
  const q = App.questions[App.currentIndex];
  const total = App.questions.length;
  const current = App.currentIndex + 1;
  const progress = (App.currentIndex / total) * 100;
  const isLast = App.currentIndex >= total - 1;

  let contentHTML = '';
  if (q.type === 'mc') {
    const letters = ['A','B','C','D'];
    contentHTML = `
      <div class="options-list">
        ${letters.map(l => `
          <button class="option-btn ${App.locked ? 'locked' : ''} 
            ${App.locked && l === (App.answers[App.currentIndex]?.userAnswer || '') && l !== q.answer ? 'wrong' : ''}
            ${App.locked && l === q.answer ? 'correct' : ''}
            ${App.locked && l !== q.answer && App.answers[App.currentIndex]?.userAnswer !== l ? '' : ''}"
            onclick="answerMC('${l}')" id="opt-${l}">
            <span class="option-letter">${l}</span>
            <span>${q.options[l]}</span>
          </button>
        `).join('')}
      </div>
    `;
  } else {
    contentHTML = `
      <div class="fb-input-group">
        ${q.answers.map((_, idx) => `
          <div class="fb-input-row">
            <label>第${idx+1}空</label>
            <input class="fb-input ${App.locked ? (checkFbAnswer(q, idx, App.answers[App.currentIndex]?.userAnswer?.[idx]) ? 'correct' : 'wrong') : ''}" 
              type="text" placeholder="请输入答案" id="fb-${idx}"
              ${App.locked ? 'disabled' : ''}
              value="${App.locked ? (App.answers[App.currentIndex]?.userAnswer?.[idx] || '') : ''}">
          </div>
        `).join('')}
      </div>
    `;
  }

  const state = App.answers[App.currentIndex];
  let feedbackHTML = '';
  if (App.locked && state) {
    if (state.correct) {
      feedbackHTML = '<div class="feedback correct-fb show">✓ 回答正确！</div>';
    } else {
      let correctAns = q.type === 'mc' ? q.options[q.answer] : q.answers.join('、');
      feedbackHTML = `<div class="feedback wrong-fb show">✗ 回答错误！正确答案：${correctAns}</div>`;
    }
  }

  app.innerHTML = `
    <div class="header fade-in-up">
      <h1>电机学题库</h1>
      <div class="subtitle">${App.mode === 'mc' ? '选择题' : App.mode === 'fb' ? '填空题' : '综合练习'}</div>
    </div>
    <div class="progress-wrap fade-in-up">
      <div class="progress-info"><span>第 ${current} / ${total} 题</span><span>${Math.round(progress)}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    </div>
    <div class="card fade-in-up">
      <span class="question-type-badge ${q.type==='mc'?'badge-mc':'badge-fb'}">${q.type==='mc'?'选择题':'填空题'}</span>
      <div class="question-text">${q.question.replace(/___/g, '<span style="color:var(--accent);border-bottom:2px solid var(--accent);padding:0 0.3rem;">______</span>')}</div>
      ${contentHTML}
      ${feedbackHTML}
    </div>
    <div class="btn-row fade-in-up">
      ${App.currentIndex > 0 ? `<button class="btn" onclick="prevQuestion()">← 上一题</button>` : ''}
      ${!App.locked && q.type === 'fb' ? `<button class="btn btn-primary" onclick="submitFB()">提交答案</button>` : ''}
      ${App.locked ? `<button class="btn btn-primary" onclick="nextQuestion()">${isLast ? '查看结果' : '下一题 →'}</button>` : ''}
      <button class="btn" onclick="quitQuiz()">退出</button>
    </div>
  `;

  // Focus first input for fill-blank
  if (q.type === 'fb' && !App.locked) {
    setTimeout(() => {
      const inp = document.getElementById('fb-0');
      if (inp) inp.focus();
    }, 100);
  }
}

function renderResults(app) {
  const total = App.answers.length;
  const correct = App.answers.filter(a => a.correct).length;
  const wrong = total - correct;
  const pct = Math.round((correct / total) * 100) || 0;
  
  let emoji = '🌟';
  if (pct >= 90) emoji = '🏆';
  else if (pct >= 70) emoji = '👍';
  else if (pct >= 50) emoji = '📚';
  else emoji = '💪';

  const wrongItems = App.answers
    .map((a, i) => ({ ...a, q: App.questions[i] }))
    .filter(a => !a.correct);

  app.innerHTML = `
    <div class="results-screen fade-in-up">
      <div class="start-title">${emoji} 练习完成</div>
      <div class="score-circle">
        <div class="score-number">${pct}%</div>
        <div class="score-label">正确率</div>
      </div>
      <div class="results-stats">
        <div><div class="val" style="color:var(--correct)">${correct}</div>正确</div>
        <div><div class="val" style="color:var(--wrong)">${wrong}</div>错误</div>
        <div><div class="val">${total}</div>总计</div>
      </div>
      ${wrongItems.length > 0 ? `
        <div class="review-section">
          <h3>📋 错题回顾（${wrongItems.length}题）</h3>
          ${wrongItems.map(item => {
            const q = item.q;
            let correctDisp = '';
            let userDisp = '';
            if (q.type === 'mc') {
              correctDisp = `${item.correctAnswer} — ${q.options[item.correctAnswer]}`;
              userDisp = item.userAnswer ? `${item.userAnswer} — ${q.options[item.userAnswer] || ''}` : '未作答';
            } else {
              correctDisp = q.answers.join('、');
              userDisp = (item.userAnswer || []).join('、') || '未作答';
            }
            return `
              <div class="review-card">
                <div class="r-q">${q.question.replace(/___/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</div>
                <div><span class="r-ua">你的答案：${userDisp}</span></div>
                <div class="r-a">正确答案：${correctDisp}</div>
              </div>
            `;
          }).join('')}
        </div>
      ` : `<div style="color:var(--correct);font-size:1.1rem;">🎉 全部正确，太棒了！</div>`}
      <div class="btn-row" style="margin-top:1rem;">
        <button class="btn btn-primary" onclick="retryWrong()" ${wrongItems.length===0?'disabled':''}>重做错题 (${wrongItems.length})</button>
        <button class="btn btn-primary" onclick="startQuiz()">再来一轮</button>
        <button class="btn" onclick="backToStart()">返回首页</button>
      </div>
    </div>
  `;
}

// ========== ACTIONS ==========
function setMode(m) { App.mode = m; render(); }
function setOrder(o) { App.order = o; render(); }

function startQuiz() {
  App.questions = buildQuestionList();
  App.currentIndex = 0;
  App.answers = new Array(App.questions.length).fill(null);
  App.locked = false;
  App.screen = 'quiz';
  render();
}

function answerMC(letter) {
  if (App.locked) return;
  App.locked = true;
  const q = App.questions[App.currentIndex];
  const correct = letter === q.answer;
  App.answers[App.currentIndex] = {
    questionId: q.id,
    userAnswer: letter,
    correctAnswer: q.answer,
    correct,
    type: 'mc'
  };
  render();
}

function submitFB() {
  if (App.locked) return;
  App.locked = true;
  const q = App.questions[App.currentIndex];
  const userAnswers = [];
  let allCorrect = true;
  for (let i = 0; i < q.answers.length; i++) {
    const inp = document.getElementById('fb-' + i);
    const val = (inp?.value || '').trim();
    userAnswers.push(val);
    const ans = q.answers[i].trim();
    if (val !== ans) {
      allCorrect = false;
    }
  }
  App.answers[App.currentIndex] = {
    questionId: q.id,
    userAnswer: userAnswers,
    correctAnswer: q.answers.join('|'),
    correct: allCorrect,
    type: 'fb'
  };
  render();
}

function checkFbAnswer(q, idx, userAnswers) {
  if (!userAnswers || !userAnswers[idx]) return false;
  return userAnswers[idx].trim() === q.answers[idx].trim();
}

function nextQuestion() {
  if (App.currentIndex < App.questions.length - 1) {
    App.currentIndex++;
    App.locked = false;
    render();
  } else {
    App.screen = 'results';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevQuestion() {
  if (App.currentIndex > 0) {
    App.currentIndex--;
    // Restore locked state for previously answered questions
    App.locked = !!App.answers[App.currentIndex];
    render();
  }
}

function quitQuiz() { App.screen = 'start'; App.questions = []; App.answers = []; render(); }
function backToStart() { App.screen = 'start'; App.questions = []; App.answers = []; render(); }

function retryWrong() {
  const wrongItems = App.answers
    .map((a, i) => ({ ...a, q: App.questions[i] }))
    .filter(a => !a.correct);
  if (wrongItems.length === 0) return;
  App.questions = wrongItems.map(w => w.q);
  App.currentIndex = 0;
  App.answers = new Array(App.questions.length).fill(null);
  App.locked = false;
  App.screen = 'quiz';
  render();
}

// ========== KEYBOARD SUPPORT ==========
document.addEventListener('keydown', (e) => {
  if (App.screen !== 'quiz') return;
  if (e.key === 'ArrowRight' && App.locked) { nextQuestion(); return; }
  if (e.key === 'ArrowLeft' && App.currentIndex > 0) { prevQuestion(); return; }
  if (!App.locked && App.questions[App.currentIndex]?.type === 'mc') {
    const key = e.key.toUpperCase();
    if (['A','B','C','D'].includes(key)) answerMC(key);
  }
  if (!App.locked && App.questions[App.currentIndex]?.type === 'fb' && e.key === 'Enter') {
    submitFB();
  }
});

// ========== INIT ==========
render();
</script>
</body>
</html>
