<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电机学刷题</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeScale { from { opacity:0; transform:scale(0.94); } to { opacity:1; transform:scale(1); } }

:root {
  --bg: #0f0f14; --card: #1a1a22; --card-hover: #21212d;
  --gold: #d4a853; --gold-dim: #a8863a; --gold-bright: #f0cc6b;
  --text: #e0dfe4; --text-dim: #8b8a94; --text-muted: #5c5b66;
  --success: #4caf7d; --error: #e0556a; --blue: #5b9bd5;
  --border: #2a2a36;
}

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.6;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
  position: relative;
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.03;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}

.container { max-width: 800px; margin: 0 auto; padding: 24px 20px 60px; position: relative; z-index: 1; }

/* ---- Screen ---- */
.screen { display: none; animation: fadeScale 0.4s ease-out; }
.screen.active { display: block; }

/* ---- Start Screen ---- */
.start-wrap { text-align: center; padding-top: 10vh; }
.start-title { font-family: 'Georgia','Noto Serif SC','SimSun',serif; font-size: clamp(2rem,5vw,3rem); font-weight: 700; color: var(--gold); margin-bottom: 8px; letter-spacing: 0.04em; }
.start-subtitle { font-size: 1rem; color: var(--text-dim); margin-bottom: 48px; }
.start-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 36px 32px; max-width: 460px; margin: 0 auto; box-shadow: 0 4px 32px rgba(0,0,0,0.4);
}
.start-card h3 { font-size: 1.05rem; color: var(--gold-dim); margin-bottom: 16px; font-weight: 600; }
.mode-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.mode-btn {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text-dim); padding: 14px 18px; cursor: pointer; font-size: 0.95rem;
  transition: all 0.25s; text-align: left; display: flex; align-items: center; gap: 10px;
  font-family: inherit;
}
.mode-btn:hover { border-color: var(--gold-dim); color: var(--text); background: var(--card-hover); }
.mode-btn.sel { border-color: var(--gold); color: var(--gold-bright); background: rgba(212,168,83,0.08); }

.order-row { display: flex; background: var(--bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 24px; }
.order-btn {
  flex: 1; padding: 12px; border: none; background: none; color: var(--text-dim);
  cursor: pointer; font-size: 0.9rem; transition: all 0.25s; font-family: inherit;
}
.order-btn:hover { color: var(--text); }
.order-btn.sel { background: var(--gold); color: #0f0f14; font-weight: 600; }

.start-go {
  width: 100%; padding: 16px; border-radius: 12px; border: none;
  background: var(--gold); color: #0f0f14; font-size: 1.1rem; font-weight: 700;
  cursor: pointer; transition: all 0.25s; font-family: inherit; letter-spacing: 0.03em;
}
.start-go:hover { background: var(--gold-bright); }

.stats-preview { display: flex; gap: 16px; justify-content: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-muted); }

/* ---- Quiz Screen ---- */
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.quiz-info { font-size: 0.9rem; color: var(--text-dim); }
.quiz-exit {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-family: inherit;
}
.quiz-exit:hover { border-color: var(--error); color: var(--error); }

.progress-wrap { margin-bottom: 20px; }
.progress-bar {
  height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; transition: width 0.3s;
}
.progress-bar div {
  height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 2px; transition: width 0.4s ease;
}

.question-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 28px 28px 24px; box-shadow: 0 4px 32px rgba(0,0,0,0.4);
  animation: fadeIn 0.35s ease-out;
}
.q-type-badge { display: inline-block; font-size: 0.75rem; padding: 3px 12px; border-radius: 99px; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.04em; }
.badge-mc { background: rgba(212,168,83,0.15); color: var(--gold-dim); border: 1px solid rgba(212,168,83,0.25); }
.badge-fb { background: rgba(91,155,213,0.15); color: var(--blue); border: 1px solid rgba(91,155,213,0.25); }
.badge-sa { background: rgba(76,175,125,0.15); color: var(--success); border: 1px solid rgba(76,175,125,0.25); }

.q-text {
  font-family: 'Georgia','Noto Serif SC','SimSun',serif;
  font-size: 1.15rem; line-height: 1.85; color: var(--text); margin-bottom: 20px;
}
.q-text u { text-decoration: none; border-bottom: 2px dashed var(--gold-dim); color: var(--gold-dim); padding: 0 6px; }

/* Options (MC) */
.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); cursor: pointer; transition: all 0.2s; font-size: 0.95rem;
}
.opt:hover { border-color: var(--gold-dim); background: rgba(212,168,83,0.06); transform: translateX(3px); }
.opt.done { cursor: default; pointer-events: none; }
.opt.correct { border-color: var(--success); background: rgba(76,175,125,0.1); }
.opt.wrong { border-color: var(--error); background: rgba(224,85,106,0.1); }
.opt-letter {
  width: 30px; height: 30px; border-radius: 8px; background: var(--card); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
}
.opt.correct .opt-letter { background: var(--success); color: #fff; border-color: var(--success); }
.opt.wrong .opt-letter { background: var(--error); color: #fff; border-color: var(--error); }
.opt-icon { margin-left: auto; font-size: 1.1rem; }

/* Reveal (FB/SA) */
.reveal-wrap { text-align: center; margin-top: 4px; }
.reveal-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 28px; border-radius: 10px; border: 1px dashed var(--gold-dim);
  background: rgba(212,168,83,0.06); color: var(--gold-dim); cursor: pointer;
  font-size: 0.95rem; transition: all 0.25s; font-family: inherit;
}
.reveal-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(212,168,83,0.12); }
.reveal-btn.done { border-style: solid; border-color: var(--border); color: var(--text-muted); background: var(--bg); pointer-events: none; }

.answer-box {
  margin-top: 16px; padding: 16px 20px; background: var(--bg); border-radius: 10px;
  border: 1px solid var(--border); display: none;
}
.answer-box.show { display: block; animation: fadeIn 0.3s; }
.ans-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
.ans-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.ans-tag {
  background: rgba(76,175,125,0.12); color: var(--success); padding: 4px 12px;
  border-radius: 6px; font-size: 0.9rem; font-weight: 600;
}
.ans-text { font-size: 0.92rem; color: var(--text); white-space: pre-line; line-height: 1.7; }

.self-eval { display: flex; gap: 10px; margin-top: 16px; justify-content: center; }
.eval-btn {
  padding: 10px 32px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text-dim); cursor: pointer;
  font-size: 0.9rem; transition: all 0.2s; font-family: inherit; font-weight: 600;
}
.eval-btn:hover { border-color: var(--gold-dim); }
.eval-btn.know.picked { background: var(--success); color: #fff; border-color: var(--success); }
.eval-btn.dunno.picked { background: var(--error); color: #fff; border-color: var(--error); }

/* Nav */
.nav-row { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
.nav-btn {
  padding: 10px 24px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer;
  font-size: 0.9rem; transition: all 0.2s; font-family: inherit;
}
.nav-btn:hover { border-color: var(--gold-dim); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-next { background: var(--gold); color: #0f0f14; border-color: var(--gold); font-weight: 600; }
.nav-next:hover { background: var(--gold-bright); }

.kb-hint { text-align: center; margin-top: 16px; font-size: 0.75rem; color: var(--text-muted); }
.kb-hint kbd {
  display: inline-block; background: var(--card); border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; margin: 0 2px;
}

/* ---- Results ---- */
.results-card {
  text-align: center; background: var(--card); border-radius: 16px;
  padding: 36px 28px; border: 1px solid var(--border);
  max-width: 480px; margin: 6vh auto 0; box-shadow: 0 4px 32px rgba(0,0,0,0.4);
}
.results-score { font-size: 4rem; font-weight: 800; color: var(--gold); font-family: 'Georgia',serif; line-height: 1; }
.results-pct { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 24px; }
.stats-grid { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; }
.stat { text-align: center; }
.stat .val { font-size: 1.5rem; font-weight: 700; }
.stat .lbl { font-size: 0.75rem; color: var(--text-dim); }
.stat.c .val { color: var(--success); } .stat.w .val { color: var(--error); }

.results-btn {
  display: block; width: 100%; max-width: 300px; margin: 8px auto;
  padding: 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); cursor: pointer;
  font-size: 0.95rem; transition: all 0.2s; font-family: inherit;
}
.results-btn:hover { border-color: var(--gold-dim); }
.results-btn:disabled { opacity: 0.35; cursor: default; }
.btn-gold { background: var(--gold); color: #0f0f14; border-color: var(--gold); font-weight: 600; }
.btn-gold:hover { background: var(--gold-bright); }

/* ---- Review ---- */
.review-list { display: flex; flex-direction: column; gap: 12px; max-width: 700px; margin: 0 auto; }
.review-item {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px;
}
.review-item .rev-q { font-size: 0.95rem; margin: 8px 0; }
.review-item .rev-your { font-size: 0.85rem; color: var(--error); }
.review-item .rev-ans { font-size: 0.85rem; color: var(--success); }
.back-link { display: inline-block; margin-top: 24px; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; }
.back-link:hover { color: var(--gold); }

@media (max-width: 500px) {
  .start-card { padding: 24px 18px; }
  .question-card { padding: 20px 16px; }
}

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container" id="app">

  <!-- START -->
  <div class="screen active" id="screen-start">
    <div class="start-wrap">
      <h1 class="start-title">电机学题库</h1>
      <p class="start-subtitle">Electrical Machinery Quiz</p>
      <div class="start-card">
        <h3>选择刷题模式</h3>
        <div class="mode-group" id="mode-group">
          <button class="mode-btn sel" data-mode="all"><span>📖</span> 全部题目 <span style="margin-left:auto;color:var(--text-muted);font-size:0.85rem">90 题</span></button>
          <button class="mode-btn" data-mode="mc"><span>✏️</span> 仅选择题 <span style="margin-left:auto;color:var(--text-muted);font-size:0.85rem">60 题</span></button>
          <button class="mode-btn" data-mode="fb-sa"><span>📝</span> 仅填空+简答 <span style="margin-left:auto;color:var(--text-muted);font-size:0.85rem">30 题</span></button>
        </div>
        <h3>题目顺序</h3>
        <div class="order-row" id="order-row">
          <button class="order-btn sel" data-order="seq">顺序出题</button>
          <button class="order-btn" data-order="rand">随机出题</button>
        </div>
        <button class="start-go" id="btn-start">开始刷题</button>
        <div class="stats-preview">
          <span>■ 选择题 60</span>
          <span>■ 填空题 27</span>
          <span>■ 简答题 3</span>
        </div>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div class="quiz-info" id="quiz-label">选择题 · 第 <strong id="q-cur">1</strong> / <strong id="q-tot">0</strong> 题</div>
      <button class="quiz-exit" id="btn-exit">退出</button>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="prog-bar"><div id="prog-fill" style="width:0%"></div></div></div>
    <div id="q-container"></div>
    <div class="nav-row">
      <button class="nav-btn" id="btn-prev">← 上一题</button>
      <button class="nav-btn nav-next" id="btn-next">下一题 →</button>
    </div>
    <div class="kb-hint">
      <kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> 选择 &nbsp;
      <kbd>←</kbd><kbd>→</kbd> 切换 &nbsp;
      <kbd>Enter</kbd> 下一题
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="screen-results">
    <div id="results-inner"></div>
  </div>

  <!-- REVIEW -->
  <div class="screen" id="screen-review">
    <div id="review-inner"></div>
  </div>

</div>

  // ===== State =====
  var state = {
    mode: 'all',
    order: 'seq',
    questions: [],
    curIdx: 0,
    answers: {},   // key=idx -> {status:'correct'|'wrong'|'viewed', user:..., know:true/false/null}

  // ===== DOM refs =====
  function E(id) { return document.getElementById(id); }
  var S_START = E('screen-start');

  // ===== Screen switching =====
  function showScreen(name) {
    [S_START,S_QUIZ,S_RES,S_REV].forEach(function(s) { s.classList.remove('active'); });
    if (name === 'start') S_START.classList.add('active');
    else if (name === 'quiz')  S_QUIZ.classList.add('active');
    else if (name === 'results') { S_RES.classList.add('active'); renderResults(); }
    else if (name === 'review')  { S_REV.classList.add('active'); renderReview(); }
  }

  // ===== Init =====
  (function initStart() {
    // Mode buttons
    E('mode-group').addEventListener('click', function(e) {
      var btn = e.target.closest('.mode-btn');
      if (!btn) return;
      E('mode-group').querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('sel'); });
      btn.classList.add('sel');
      state.mode = btn.dataset.mode;
    });

    // Order buttons
    E('order-row').addEventListener('click', function(e) {
      var btn = e.target.closest('.order-btn');
      if (!btn) return;
      E('order-row').querySelectorAll('.order-btn').forEach(function(b) { b.classList.remove('sel'); });
      btn.classList.add('sel');
      state.order = btn.dataset.order;
    });

    // Start
    E('btn-start').addEventListener('click', startQuiz);
    E('btn-exit').addEventListener('click', function(){ showScreen('start'); });
  })();

  // ===== Build question list =====
  function buildList() {
    var list = [];
    if (state.mode === 'all' || state.mode === 'mc')
      MC.forEach(function(q) { list.push({ type:'mc', data:q }); });
    if (state.mode === 'all' || state.mode === 'fb-sa') {
      FB.forEach(function(q) { list.push({ type:'fb', data:q }); });
      SA.forEach(function(q) { list.push({ type:'sa', data:q }); });
    }
    if (state.order === 'rand') {
      for (var i = list.length-1; i>0; i--) {
        var j = Math.floor(Math.random()*(i+1));
        var t = list[i]; list[i] = list[j]; list[j] = t;
      }
    }
    return list;
  }

  // ===== Start quiz =====
  function startQuiz() {
    state.questions = buildList();
    state.curIdx = 0;
    state.answers = {};
    state.isRedo = false;
    showScreen('quiz');
    renderQ();
  }

  function startRedo() {
    var wrongIdx = [];
    for (var i = 0; i < state.questions.length; i++) {
      var a = state.answers[i];
      if (a && (a.status === 'wrong' || (a.status === 'viewed' && a.know === false)))
        wrongIdx.push(i);
    }
    if (wrongIdx.length === 0) { alert('没有错题可重做！'); return; }
    var newQ = wrongIdx.map(function(i){ return state.questions[i]; });
    state.questions = newQ;
    state.curIdx = 0;
    state.answers = {};
    state.isRedo = true;
    showScreen('quiz');
    renderQ();
  }

  // ===== Render question =====
  function renderQ() {
    var q = state.questions[state.curIdx];
    if (!q) return;
    var idx = state.curIdx, total = state.questions.length;

    E('q-cur').textContent = idx + 1;
    E('q-tot').textContent = total;
    E('prog-fill').style.width = ((idx+1)/total*100) + '%';

    var typeLabel = q.type==='mc'?'选择题':q.type==='fb'?'填空题':'简答题';
    E('quiz-label').innerHTML = typeLabel + ' · 第 <strong id="q-cur">'+(idx+1)+'</strong> / <strong id="q-tot">'+total+'</strong> 题';

    E('btn-prev').style.visibility = idx > 0 ? 'visible' : 'hidden';
    E('btn-next').textContent = (idx >= total-1) ? '完成 ✓' : '下一题 →';

    if (q.type === 'mc') E('q-container').innerHTML = renderMC(q, idx);
    else if (q.type === 'fb') E('q-container').innerHTML = renderFB(q, idx);
    else E('q-container').innerHTML = renderSA(q, idx);
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderMC(q, idx) {
    var a = state.answers[idx];
    var done = !!a;
    var html = '<div class="question-card">';
    html += '<span class="q-type-badge badge-mc">选择题</span>';
    html += '<div class="q-text">'+esc(q.data.question)+'</div>';
    html += '<div class="options">';
    ['A','B','C','D'].forEach(function(l) {
      var cls = 'opt';
      if (done) {
        cls += ' done';
        if (l === q.data.answer) cls += ' correct';
        else if (a.status === 'wrong' && l === a.user) cls += ' wrong';
      }
      var icon = '';
      if (done) {
        if (l === q.data.answer) icon = '<span class="opt-icon" style="color:var(--success)">✔</span>';
        else if (a.status === 'wrong' && l === a.user) icon = '<span class="opt-icon" style="color:var(--error)">✘</span>';
      }
      html += '<div class="'+cls+'" data-letter="'+l+'"><span class="opt-letter">'+l+'</span><span>'+esc(q.data.options[l])+'</span>'+icon+'</div>';
    });
    html += '</div></div>';
    return html;
  }

  function renderFB(q, idx) {
    var a = state.answers[idx];
    var revealed = !!a;
    var evaled = revealed && a.know !== null;
    var disp = q.data.question.replace(/___/g, '<u>______</u>');
    var html = '<div class="question-card">';
    html += '<span class="q-type-badge badge-fb">填空题</span>';
    html += '<div class="q-text">'+disp+'</div>';

    html += '<div class="ans-label">参考答案</div>';
    html += '<div class="ans-tags">';
    q.data.answers.forEach(function(x) { html += '<span class="ans-tag">'+esc(x)+'</span>'; });
    html += '</div></div>';
    if (revealed) {
      html += '<div class="self-eval" id="self-eval">';
      var kCls = 'eval-btn know'+(evaled&&a.know===true?' picked':'');
      var dCls = 'eval-btn dunno'+(evaled&&a.know===false?' picked':'')+(evaled?' hidden':'');
      html += '<button class="'+kCls+'" data-v="know"'+(evaled?' disabled':'')+'>✔ 会了</button>';
      html += '<button class="'+dCls+'" data-v="dunno"'+(evaled?' disabled':'')+'>✘ 不会</button>';
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }

  function renderSA(q, idx) {
    var a = state.answers[idx];
    var revealed = !!a;
    var evaled = revealed && a.know !== null;
    var html = '<div class="question-card">';
    html += '<span class="q-type-badge badge-sa">简答题</span>';

      html += '<div class="self-eval" id="self-eval">';

      html += '<button class="'+dCls+'" data-v="dunno"'+(evaled?' disabled':'')+'>✘ 不会</button>';

  // ===== Event delegation on question container (robust, survives re-renders) =====
  E('q-container').addEventListener('click', function(e) {
    var idx = state.curIdx;
    var q = state.questions[idx];
    if (!q) return;

    // Reveal button (FB/SA)
    var rv = e.target.closest('#reveal-btn');
    if (rv && !state.answers[idx]) {
      state.answers[idx] = { status: 'viewed', user: null, know: null };
      renderQ();
      return;
    }

    // MC option
    var opt = e.target.closest('.opt:not(.done)');
    if (opt && q.type === 'mc' && !state.answers[idx]) {
      var letter = opt.dataset.letter;
      state.answers[idx] = { status: letter === q.data.answer ? 'correct' : 'wrong', user: letter, know: null };
      renderQ();
      if (idx < state.questions.length - 1) setTimeout(goNext, 800);
      return;
    }

    // Self-eval button (FB/SA)
    var ev = e.target.closest('.eval-btn:not([disabled]):not(.hidden)');
    if (ev) {
      var a = state.answers[idx];
      if (a && a.status === 'viewed' && a.know === null) {
        a.know = (ev.dataset.v === 'know');
        renderQ();
        if (idx < state.questions.length - 1) setTimeout(goNext, 600);
      }
      return;
    }
  });

  // ===== Navigation =====
  function goNext() {
    if (state.curIdx < state.questions.length - 1) {
      state.curIdx++;
      renderQ();
    } else {
      showScreen('results');
    }
  }

  function goPrev() {
    if (state.curIdx > 0) {
      state.curIdx--;
      renderQ();
    }
  }

  E('btn-next').addEventListener('click', goNext);
  E('btn-prev').addEventListener('click', goPrev);

  // ===== Results =====
  function renderResults() {
    var total = state.questions.length;
    var correct = 0, wrong = 0, viewed = 0, know = 0, dunno = 0;
    var wrongQs = [];
    for (var i = 0; i < total; i++) {
      var a = state.answers[i];
      if (!a) continue;
      if (a.status === 'correct') correct++;
      else if (a.status === 'wrong') { wrong++; wrongQs.push(i); }
      else if (a.status === 'viewed') {
        viewed++;
        if (a.know === true) know++;
        else if (a.know === false) { dunno++; wrongQs.push(i); }
      }
    }
    var answered = correct + wrong;
    var pct = answered > 0 ? Math.round(correct / answered * 100) : '-';

    var h = '<div class="results-card">';
    h += '<h2 style="color:var(--gold);font-family:Georgia,serif;font-size:1.5rem;">刷题完成</h2>';
    if (state.isRedo) h += '<p style="color:var(--text-dim);">（错题重做模式）</p>';
    h += '<div class="results-score">'+(typeof pct==='number'?pct+'%':pct)+'</div>';
    h += '<div class="results-pct">选择题正确率</div>';
    h += '<div class="stats-grid">';
    h += '<div class="stat c"><div class="val">'+correct+'</div><div class="lbl">正确</div></div>';

    h += '<div class="stat c"><div class="val">'+know+'</div><div class="lbl">会了</div></div>';

    h += '</div>';

    h += '<div style="margin-top:20px;">';

    if (rst) rst.addEventListener('click', function(){ showScreen('start'); });

  function renderReview() {
    var wrongList = [];
    for (var i = 0; i < state.questions.length; i++) {
      var a = state.answers[i];
      if (!a) continue;
      if (a.status === 'wrong' || (a.status === 'viewed' && a.know === false))
        wrongList.push(i);

        } else if (q.type === 'fb') {
          h += '<div class="rev-ans">正确答案：'+q.data.answers.map(function(x){return esc(x)}).join('、')+'</div>';
        } else {
          h += '<div class="rev-ans" style="white-space:pre-line;">正确答案：'+esc(q.data.answer)+'</div>';
        }
        h += '</div>';
      });
      h += '</div>';
    }
    h += '<div style="text-align:center;"><span class="back-link" id="btn-back">← 返回结果</span></div>';
    E('review-inner').innerHTML = h;
    var bk = E('btn-back');
    if (bk) bk.addEventListener('click', function(){ showScreen('results'); });
  }

  // ===== Keyboard =====
  document.addEventListener('keydown', function(e) {
    if (!S_QUIZ.classList.contains('active')) return;
    var q = state.questions[state.curIdx];
    if (!q) return;

    if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); return; }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); goPrev(); return; }

    if (q.type === 'mc' && !state.answers[state.curIdx]) {
      var k = e.key.toUpperCase();
      if (['A','B','C','D'].indexOf(k) >= 0) {
        e.preventDefault();
        state.answers[state.curIdx] = { status: k===q.data.answer?'correct':'wrong', user: k, know: null };
        renderQ();
        if (state.curIdx < state.questions.length-1) setTimeout(goNext, 800);
      }
    }

    if ((q.type === 'fb' || q.type === 'sa')) {
      var a = state.answers[state.curIdx];
      if (!a && e.key === ' ') {
        e.preventDefault();
        state.answers[state.curIdx] = { status:'viewed', user:null, know:null };
        renderQ();
      } else if (a && a.status === 'viewed' && a.know === null && e.key === 'Enter') {
        e.preventDefault();
        a.know = true;
        renderQ();
        if (state.curIdx < state.questions.length-1) setTimeout(goNext, 600);
      }
    }
  });
})();
</script>
</body>
</html>
